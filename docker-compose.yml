services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mounted read-only so models can be swapped without rebuilding
      # the image; the image's own copy is used when compose is not.
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
